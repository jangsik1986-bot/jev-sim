<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<title>nomadearth.jev-topic-router</title>
<style>
:root{
  --paper:#FAF3E6; --paper2:#F3E6CE; --card:#FFFDF7; --ink:#2B2520; --ink2:#7A6E5F; --ink3:#A2947E;
  --line:rgba(43,37,32,.16); --line2:rgba(43,37,32,.09);
  --orange:#E8712B; --orange2:#F2A15C; --green:#2E8B57; --blue:#2F6FB0; --amber:#C88A12;
  --magenta:#C21F6A; --teal:#0F8A80; --violet:#7A5AA8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Malgun Gothic",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(140% 100% at 20% -10%, #FFFCF4 0%, #FAF3E6 42%, #F1E3C9 100%);
  color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased;
  padding:14px 14px 26px;
}
.app{max-width:1660px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:7px;box-shadow:0 2px 0 rgba(255,255,255,.8) inset,0 24px 50px -34px rgba(70,45,15,.55);overflow:hidden}

/* ---------- top status bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;height:34px;padding:0 10px 0 11px;
  border-bottom:1px solid var(--line2);background:linear-gradient(#FFFDF8,#FBF4E6);flex-wrap:nowrap;overflow:hidden}
.brand{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.bdot{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px rgba(232,113,43,.14)}
.bname{font:600 10.5px/1 var(--mono);letter-spacing:.02em;color:#4A4038;white-space:nowrap}
.stats{display:flex;align-items:center;gap:9px;flex:1 1 auto;min-width:0;overflow:hidden}
.st{display:flex;align-items:center;gap:4px;white-space:nowrap;font:500 9px/1 var(--mono);letter-spacing:.09em;color:var(--ink3)}
.st b{font:700 9.5px/1 var(--mono);letter-spacing:.02em;color:#3A322B}
.st b.o{color:var(--orange)}
.ctl{display:flex;gap:4px;flex:0 0 auto}
.btn{font:600 10px/1 var(--mono);letter-spacing:.04em;color:#4A4038;background:#FFFDF7;
  border:1px solid var(--line);border-radius:3px;padding:4px 7px;cursor:pointer;min-width:26px}
.btn:hover{border-color:var(--orange);color:var(--orange)}
.btn:active{transform:translateY(1px)}

/* ---------- stage ---------- */
.stage-wrap{position:relative;overflow-x:auto;overflow-y:hidden;
  background:
    linear-gradient(rgba(43,37,32,.055) 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg,rgba(43,37,32,.055) 1px,transparent 1px) 0 0/40px 40px,
    radial-gradient(120% 90% at 28% 4%,#FFFCF3 0%,#FAF3E6 48%,#F4E7CF 100%);
  border-bottom:1px solid var(--line2)}
.stage-out{position:relative;overflow:hidden;transform-origin:0 0}
.world{position:relative;width:1600px;height:780px;transform-origin:0 0}
#wires{position:absolute;left:0;top:0;width:1600px;height:780px;display:block}

.bus{position:absolute;left:452px;top:90px;width:22px;height:600px;border-radius:4px;
  background:linear-gradient(#FFFDF7,#FBF3E3);border:1px solid rgba(43,37,32,.18);
  box-shadow:0 1px 0 #fff inset,0 6px 14px -10px rgba(70,45,15,.6);opacity:0;transition:opacity .5s}
.bus.in{opacity:1}
.bus .cap{position:absolute;left:-1px;top:-1px;right:-1px;height:16px;border-radius:4px 4px 2px 2px;background:var(--orange)}
.bus .buslbl{position:absolute;left:50%;bottom:6px;transform:translateX(-50%) rotate(-90deg);transform-origin:center;
  font:600 7.5px/1 var(--mono);letter-spacing:.16em;color:#B3A48B;white-space:nowrap}

/* ---------- nodes ---------- */
#nodes{position:absolute;left:0;top:0;width:100%;height:100%}
.node{position:absolute;background:#FFFDF7;border:1px solid rgba(43,37,32,.18);border-radius:2px;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 5px 12px -9px rgba(70,45,15,.65);
  opacity:0;transform:translateY(4px);transition:opacity .38s ease,transform .38s ease,box-shadow .3s,border-color .3s;
  overflow:hidden;cursor:pointer}
.node.in{opacity:1;transform:none}
.node:hover{border-color:rgba(43,37,32,.42);box-shadow:0 1px 0 #fff inset,0 10px 20px -12px rgba(70,45,15,.8);z-index:6}
.node.act{box-shadow:0 1px 0 #fff inset,0 0 0 1px rgba(232,113,43,.5),0 8px 22px -10px rgba(232,113,43,.55)}
.nh{height:19px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;color:#fff;gap:6px}
.nh .nt{font:600 9.5px/1 var(--mono);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nh .nv{font:700 9.5px/1 var(--mono);letter-spacing:.02em;opacity:.9;white-space:nowrap}
.nb{padding:5px 6px 4px}
.r{display:flex;align-items:center;height:15px;gap:4px;font-size:10.5px;line-height:15px;white-space:nowrap;overflow:hidden}
.r .dt{width:4px;height:4px;border-radius:50%;flex:0 0 4px;background:#C9BCA4}
.r .rl{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;color:#4B4239}
.r .rv{margin-left:auto;font:600 10px/1 var(--mono);color:#2B2520;flex:0 0 auto}
.r .mb{flex:0 0 26px;height:3px;background:#EBE0CB;border-radius:2px;overflow:hidden}
.r .mb i{display:block;height:100%;border-radius:2px}
.r.dim .rl,.r.dim .rv{color:#A2947E}
.r.link .rl{text-decoration:underline;text-decoration-color:rgba(43,37,32,.25);text-underline-offset:2px}
.r.link:hover .rl{color:var(--orange)}
.r[data-href]{cursor:pointer}
.sb{display:flex;height:5px;margin-top:4px;border-radius:2px;overflow:hidden;background:#EBE0CB}
.sb i{display:block;height:100%}
.pills{display:flex;gap:4px;margin-top:4px;height:14px;overflow:hidden}
.pl{font:600 8px/1 var(--mono);letter-spacing:.02em;padding:2px 4px;border:1px solid;border-radius:2px;white-space:nowrap;color:#6B6257}

/* ---------- stage badge ---------- */
.badge{position:absolute;left:50%;bottom:24px;transform:translateX(-50%) translateY(6px);display:flex;align-items:center;gap:9px;
  background:rgba(255,253,247,.97);border-radius:999px;padding:6px 14px 6px 11px;
  box-shadow:0 0 0 1px rgba(43,37,32,.1),0 12px 26px -16px rgba(70,45,15,.8);opacity:0;transition:opacity .4s,transform .4s}
.badge.in{opacity:1;transform:translateX(-50%)}
.badge .bd{width:7px;height:7px;border-radius:50%;background:var(--orange);animation:pulse 1.6s infinite}
.badge.done .bd{animation:none;background:var(--green)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,113,43,.45)}50%{box-shadow:0 0 0 5px rgba(232,113,43,0)}}
.btxt b{display:block;font:700 10px/1.25 var(--mono);letter-spacing:.14em}
.btxt span{display:block;font:400 8.5px/1.3 var(--mono);letter-spacing:.02em;color:#8A7C68;margin-top:1px}
.bl{font:700 8px/1 var(--mono);letter-spacing:.1em;color:var(--orange);border:1px solid rgba(232,113,43,.4);
  border-radius:2px;padding:3px 5px;background:rgba(232,113,43,.07)}
.badge.done .bl{color:var(--green);border-color:rgba(46,139,87,.4);background:rgba(46,139,87,.07)}

/* ---------- tooltip ---------- */
.tip{position:absolute;z-index:20;max-width:290px;background:#211D19;color:#F7F1E4;border-radius:4px;
  padding:7px 9px 8px;font:400 9.5px/1.55 var(--mono);box-shadow:0 14px 30px -14px rgba(0,0,0,.8);
  opacity:0;pointer-events:none;transition:opacity .16s;transform:translate(-50%,-100%)}
.tip.in{opacity:1}
.tip.below{transform:translate(-50%,0)}
.tip b{display:block;font:700 10px/1.4 var(--mono);letter-spacing:.04em;margin-bottom:3px;color:#fff}
.tip .tl{color:#C6B9A2}
.tip .tl i{font-style:normal;color:var(--orange2)}
.tip .tf{margin-top:5px;color:#8E8271;font-size:8.5px;letter-spacing:.04em}

/* ---------- bottom panels ---------- */
.panels{display:grid;grid-template-columns:1.04fr .92fr .74fr 1.02fr;gap:9px;padding:9px;background:#FBF4E6}
.panel{background:var(--card);border:1px solid var(--line);border-radius:3px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:6px;height:20px;padding:0 7px;
  border-bottom:1px solid var(--line2);background:#FFFBF2;
  font:600 8.5px/1 var(--mono);letter-spacing:.1em;color:#8A7C68;text-transform:uppercase}
.ph .tag{color:#B3A48B;letter-spacing:.04em}
.pb{padding:6px 7px 7px;flex:1 1 auto;min-height:0;height:236px;overflow:hidden}

.code{font:400 8.5px/1.5 var(--mono);color:#5B5147;height:220px;overflow:auto}
.code .ln{display:flex;gap:6px;white-space:pre}
.code .no{flex:0 0 16px;text-align:right;color:#C6B9A2;user-select:none}
.code .tx{white-space:pre;flex:1 1 auto}
.code .hl{background:linear-gradient(90deg,rgba(232,113,43,.14),rgba(232,113,43,.03));border-left:2px solid var(--orange);
  margin-left:-2px;padding-left:0;color:#2B2520}
.code .c{color:#A2947E}
.code .k{color:#B4306F}

.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:1fr auto;gap:0 6px;align-items:center;font:500 9.5px/1.25 var(--mono)}
.brow .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#4B4239}
.brow .bv{color:#2B2520;font-weight:700}
.btrack{grid-column:1/3;height:5px;background:#EBE0CB;border-radius:2px;overflow:hidden;margin-top:2px}
.btrack i{display:block;height:100%;border-radius:2px;transition:width .6s ease}
.bmeta{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;padding-top:7px;border-top:1px dashed var(--line)}
.bmeta .sm{font:400 8.5px/1.5 var(--mono);color:#8A7C68}
.big{font:700 21px/1 var(--mono);letter-spacing:-.02em;color:var(--orange)}
.big small{font:500 9px/1 var(--mono);color:#8A7C68;letter-spacing:.04em;margin-left:3px}

.cost{font:500 9.5px/1.9 var(--mono)}
.cost .cr{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted rgba(43,37,32,.12);padding:1px 0}
.cost .cr span:first-child{color:#8A7C68;letter-spacing:.05em}
.cost .cr span:last-child{color:#2B2520;font-weight:600}
.costbig{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.costbig .cu{font:400 8px/1.4 var(--mono);color:#A2947E;text-align:right}

.log{font:400 9px/1.72 var(--mono);color:#5B5147;height:220px;overflow:auto}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:logIn .3s ease}
.log .t{color:#B3A48B;margin-right:5px}
.log .g{color:var(--green)}
.log .o{color:var(--orange)}
.log .m{color:var(--magenta)}
.log .b{color:#2B2520;font-weight:700}
@keyframes logIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.appx{margin:0 9px 9px;border:1px solid var(--line);border-radius:3px;background:var(--card);overflow:hidden}
.appx summary{cursor:pointer;padding:7px 9px;font:600 9px/1 var(--mono);letter-spacing:.09em;color:#8A7C68;background:#FFFBF2}
.appx table{width:100%;border-collapse:collapse;font:400 10px/1.5 var(--mono)}
.appx th,.appx td{padding:4px 8px;border-top:1px solid var(--line2);text-align:left;vertical-align:middle}
.appx th{color:#8A7C68;font-weight:600;letter-spacing:.05em;font-size:9px;background:#FFFBF2}
.appx td.n{text-align:right;white-space:nowrap}
.appx a{color:#2B2520;text-decoration:none;border-bottom:1px dotted rgba(43,37,32,.35)}
.appx a:hover{color:var(--orange);border-bottom-color:var(--orange)}
.fp{display:inline-block;font:700 8px/1 var(--mono);padding:2px 4px;border-radius:2px;color:#fff}
.foot{padding:7px 10px 9px;font:400 9px/1.7 var(--mono);color:#A2947E}

/* ---------- drawer ---------- */
.veil{position:fixed;inset:0;background:rgba(40,30,18,.22);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.veil.in{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--card);z-index:41;
  transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.7,.3,1);display:flex;flex-direction:column;
  box-shadow:-18px 0 40px -24px rgba(60,40,15,.7);border-left:1px solid var(--line)}
.drawer.in{transform:none}
.dh{padding:11px 12px 9px;border-bottom:1px solid var(--line2);background:#FFFBF2;position:relative}
.dh b{display:block;font:700 11px/1.4 var(--mono);letter-spacing:.06em}
.dh span{display:block;font:400 9px/1.5 var(--mono);color:#8A7C68;margin-top:2px}
.dh .x{position:absolute;right:8px;top:9px;cursor:pointer;color:#8A7C68;font:700 12px/1 var(--mono);padding:2px 4px}
.dh .x:hover{color:var(--orange)}
.dlist{overflow:auto;flex:1 1 auto;padding:6px 10px 16px}
.di{padding:7px 0;border-bottom:1px dotted rgba(43,37,32,.14)}
.di a{color:#2B2520;text-decoration:none;font:600 10.5px/1.5 var(--sans);display:block}
.di a:hover{color:var(--orange)}
.di .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font:400 8.5px/1.4 var(--mono);color:#8A7C68}
.di .m .fp{font-size:7.5px}
.dsec{padding:10px 10px 0;font:600 8.5px/1 var(--mono);letter-spacing:.1em;color:#A2947E}

/* ---------- mode toggle · mobile portrait ---------- */
.btn.on{border-color:var(--orange);color:var(--orange)}
#modeBtn{font-size:11px}
@media(max-width:700px){
  body{padding:6px 6px 14px;-webkit-text-size-adjust:100%}
  .topbar{height:40px;padding:0 8px}
  .btn{min-height:32px;min-width:36px;font-size:12px;padding:7px 10px;border-radius:5px}
  .stage-wrap{overflow-x:hidden;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  .tip{display:none}
  .badge{bottom:12px;padding:5px 11px 5px 9px}
  .btxt b{font-size:9px}
  .btxt span{font-size:8px}
}
@media(max-width:1180px){.panels{grid-template-columns:1fr 1fr}}
@media(max-width:700px){
  body{padding:8px 8px 18px}
  .panels{grid-template-columns:1fr}
  .topbar .st.opt{display:none}
  .bname{font-size:9.5px}
}
@media(prefers-reduced-motion:reduce){
  .node,.badge,.bus{transition:none}
}
</style>
</head>

<div class="app">

    <div class="brand"><span class="bdot"></span><span class="bname">nomadearth.jev-topic-router</span></div>

  <div class="stage-wrap" id="stageWrap">

  <div class="panels" id="panels"></div>

  <div class="foot" id="foot"></div>
</div>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer">

        c2x: x1 + (x2 - x1) * 0.65 + (rnd() - 0.5) * 220, c2y: y2 + (rnd() - 0.5) * 150,
        col: '#2B2520', w: 0.7 + rnd() * 0.5, al: 0.09 + rnd() * 0.1, st: (z % 4 === 0 ? -2 : -1)
      });
    }

    /* 화면 밖으로 흐르는 선 */
    for (var f2 = 0; f2 < 16; f2++) {
      var nd2 = all[(rnd() * all.length) | 0];
      if (!nd2) continue;
      var right = rnd() < 0.62;
      var yy = nd2.y + 12 + rnd() * (nd2.h - 20);
      edge({
        x1: right ? nd2.x + nd2.w : nd2.x, y1: yy,
        x2: right ? W + 70 + rnd() * 220 : -70 - rnd() * 180, y2: yy + (rnd() - 0.5) * 190,
        c1x: right ? nd2.x + nd2.w + 80 : nd2.x - 80, c1y: yy + (rnd() - 0.5) * 120,
        c2x: right ? W + 40 : -40, c2y: yy + (rnd() - 0.5) * 150,
        col: '#2B2520', w: 0.7, al: 0.1 + rnd() * 0.08, st: -1
      });
    }
  }

  function bezPt(e, t) {
    var mt = 1 - t, a = mt * mt * mt, b = 3 * mt * mt * t, c = 3 * mt * t * t, d = t * t * t;
    return [
      a * e.x1 + b * e.c1x + c * e.c2x + d * e.x2,
      a * e.y1 + b * e.c1y + c * e.c2y + d * e.y2
    ];
  }

  function pathOf(e) {
    var p = new Path2D();
    p.moveTo(e.x1, e.y1);
    p.bezierCurveTo(e.c1x, e.c1y, e.c2x, e.c2y, e.x2, e.y2);
    return p;
  }

      else if (e.st === -2) pMesh2.addPath(p);
      else pMesh.addPath(p);
    }
  }

    for (var i = 0; i < els.length; i++) {
      var el = els[i], txt = el.textContent;
      var m = txt.match(/^(-?[\d,]+(?:\.\d+)?)(.*)$/);
      if (!m) continue;
      var target = Number(m[1].replace(/,/g, ''));
      if (isNaN(target) || target === 0) continue;
      tweens.push({ el: el, to: target, suffix: m[2], dec: (m[1].split('.')[1] || '').length, t0: T.t, ms: 0.6 });
      el.textContent = '0' + m[2];
    }
  }
  function runTweens(dt) {
    for (var i = tweens.length - 1; i >= 0; i--) {
      var w = tweens[i];
      var p = (T.t - w.t0) / w.ms;
      if (p >= 1) { w.el.textContent = fmtNum(w.to, w.dec) + w.suffix; tweens.splice(i, 1); continue; }
      if (p < 0) continue;
      var v = w.to * p;
      w.el.textContent = fmtNum(v, w.dec) + w.suffix;
    }
  }
  function fmtNum(v, dec) {
    if (dec > 0) return v.toFixed(dec);
    return comma(v);
  }

  /* 와이어 드로잉 */
  function drawWires() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'round';
    var fin = Math.min(1, T.t / 0.8);
    ctx.globalAlpha = fin;

    if (pMesh) { ctx.strokeStyle = 'rgba(43,37,32,0.24)'; ctx.lineWidth = 0.8; ctx.stroke(pMesh); }
    if (pMesh2) { ctx.strokeStyle = 'rgba(43,37,32,0.34)'; ctx.lineWidth = 0.9; ctx.stroke(pMesh2); }
    if (pFlow) { ctx.strokeStyle = 'rgba(43,37,32,0.34)'; ctx.lineWidth = 1; ctx.stroke(pFlow); }
    if (pFan) { ctx.strokeStyle = 'rgba(232,113,43,0.42)'; ctx.lineWidth = 1.1; ctx.stroke(pFan); }
    if (pRoute) { ctx.strokeStyle = 'rgba(43,37,32,0.16)'; ctx.lineWidth = 0.9; ctx.stroke(pRoute); }
    ctx.globalAlpha = 1;

    /* lit edges */
    var s = T.stage < 0 ? 0 : T.stage;
    var lit = [];
    for (var i = 0; i < edges.length; i++) {
      var e = edges[i];
      if (e.st < 0) continue;
      if (e.st > s) continue;
      lit.push(e);
      var hot = (e.st === s);
      var alpha = hot ? 0.9 : 0.28;
      var col = e.st === 2 ? e.col : '#E8712B';
      ctx.beginPath();
      ctx.moveTo(e.x1, e.y1);
      ctx.bezierCurveTo(e.c1x, e.c1y, e.c2x, e.c2y, e.x2, e.y2);
      ctx.strokeStyle = col;
      ctx.globalAlpha = alpha * 0.55;
      ctx.lineWidth = hot ? 1.7 : 1;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* packets */
    var now = T.t;
    for (var p = 0; p < lit.length; p++) {
      var ed = lit[p];
      if (ed.st !== s) continue;
      var col2 = ed.st === 2 ? ed.col : '#F2A15C';
      for (var k = 0; k < 2; k++) {
        var prog = ((now * 0.55) + (p * 0.137) + k * 0.5) % 1;
        var pt = bezPt(ed, prog);
        /* trail */
        for (var tr = 3; tr >= 1; tr--) {
          var tp = Math.max(0, prog - tr * 0.022);
          var pp = bezPt(ed, tp);
          ctx.beginPath();
          ctx.moveTo(pp[0], pp[1]);
          ctx.lineTo(bezPt(ed, Math.max(0, prog - (tr - 1) * 0.022))[0], bezPt(ed, Math.max(0, prog - (tr - 1) * 0.022))[1]);
          ctx.strokeStyle = col2;
          ctx.globalAlpha = 0.16 * (4 - tr);
          ctx.lineWidth = 1.6;
          ctx.stroke();
        }
        ctx.globalAlpha = 0.95;
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], 1.9, 0, Math.PI * 2);
        ctx.fillStyle = col2;
        ctx.fill();
        ctx.globalAlpha = 0.22;
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], 4.6, 0, Math.PI * 2);
        ctx.fillStyle = col2;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    /* ports */
    ctx.fillStyle = 'rgba(46,139,87,0.85)';
    for (var d = 0; d < ports.length; d++) {
      ctx.beginPath();
      ctx.arc(ports[d][0], ports[d][1], 1.7, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ============================================================
     9. 루프 · 컨트롤
     ============================================================ */
  var frameEl = null;
  function loop(now) {
    var dt = T.last ? Math.min(0.06, (now - T.last) / 1000) : 0;
    T.last = now;
    if (T.playing) {
      T.t += dt * T.speed;
      tickTimeline();
      runTweens(dt);
    }
    T.frame++;
    drawWires();
    if (!frameEl) frameEl = document.getElementById('frameNum');
    if (frameEl && T.frame % 3 === 0) frameEl.textContent = ('0000' + (T.frame % 10000)).slice(-4);
    requestAnimationFrame(loop);
  }

  function togglePlay() {
    T.playing = !T.playing;
    document.getElementById('playBtn').textContent = T.playing ? '❚❚' : '▶';
    if (T.playing) { badgeL.textContent = T.stage >= 3 ? 'DONE' : 'LIVE'; }
    else badgeL.textContent = 'PAUSE';
  }
  function cycleSpeed() {
    T.speed = T.speed === 1 ? 2 : (T.speed === 2 ? 4 : 1);
    document.getElementById('spdBtn').textContent = T.speed + 'x';
  }
  function restart() {
    resetRun(); tweens.length = 0; countUpDone = false;
    T.playing = true;
    document.getElementById('playBtn').textContent = '❚❚';
    T.t = 0.001;
  }
  var countUpDone = false;

  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('spdBtn').addEventListener('click', cycleSpeed);
  document.getElementById('rstBtn').addEventListener('click', restart);
  document.getElementById('modeBtn').addEventListener('click', switchMode);

  function styleBus() {
    var busEl = document.getElementById('bus');
    if (!busEl) return;
    busEl.style.left = BUS.x + 'px';
    busEl.style.top = BUS.top + 'px';
    busEl.style.width = BUS.w + 'px';
    busEl.style.height = BUS.h + 'px';
    var lbl = busEl.querySelector ? busEl.querySelector('.buslbl') : null;
    if (lbl) {
      if (MODE === 'm') {
        lbl.style.transform = 'translate(-50%,-50%)';
        lbl.style.top = '50%'; lbl.style.bottom = 'auto'; lbl.style.left = '50%';
      } else {
        lbl.style.transform = ''; lbl.style.top = ''; lbl.style.bottom = ''; lbl.style.left = '';
      }
    }
  }
  function pickMobileWidth() {
    /* 폰 세로 화면(9:16)에 그래프가 좌우 여백 없이 한 화면에 들어오도록 캔버스 폭을 정합니다.
       1) 기준 폭(460)으로 한 번 배치해 전체 높이를 재고
       2) 화면 가로/세로 비율에 맞는 폭을 계산해 다시 배치합니다. */
    var wrapEl = document.getElementById('stageWrap');
    var avail = (wrapEl && wrapEl.clientWidth) || ((window.innerWidth || 400) - 24);
    var availH = (window.innerHeight || 900) - 88;
    layoutMobile(460);
    if (!availH || availH < 120) return 460;
    var need = Math.round(H * (avail / availH));
    return Math.max(MW_MIN, Math.min(MW_MAX, need));
  }
  function applyMode() {
    if (MODE === 'm') layoutMobile(pickMobileWidth()); else restorePC();
    renderNodes();
    buildEdges();
    buildPaths();
    styleBus();
    fit();
    try { if (window.localStorage) window.localStorage.setItem('jevSimMode', MODE); } catch (e) {}
    var mb = document.getElementById('modeBtn');
    if (mb) {
      mb.textContent = MODE === 'm' ? '📱' : '🖥';
      mb.title = MODE === 'm' ? '모바일 세로(9:16) 보기 — 누르면 PC 보기' : 'PC 보기 — 누르면 모바일 세로(9:16) 보기';
    }
    /* 이미 재생 중이던 상태 유지: 나타난 노드·스테이지를 다시 표시 */
    for (var i = 0; i < nodes.length; i++) {
      var nd = nodes[i];
      var box = document.getElementById('n_' + nd.id);
      if (box && T.t >= nd.appear) box.classList.add('in');
    }
    if (T.stage >= 0) setStage(T.stage);
  }
  function setMode(m2) {
    if (m2 !== 'm' && m2 !== 'p') return;
    MODE = m2;
    applyMode();
  }
  function switchMode() { setMode(MODE === 'm' ? 'p' : 'm'); }

  function fit() {
    var wrap = document.getElementById('stageWrap');
    var out = document.getElementById('stageOut');
    var world = document.getElementById('world');
    world.style.width = W + 'px';
    world.style.height = H + 'px';
    var avail = wrap.clientWidth || W;
    var s;
    if (MODE === 'm') {
      /* 폰에서 세로 스크롤 없이 한 화면에 들어오도록 높이까지 맞춥니다. */
      /* 폭을 꽉 채워 좌우 여백을 없앱니다. 세로가 넘칠 때만 그만큼 줄입니다. */
      var availH = (window.innerHeight || 900) - 88;
      s = avail / W;
      if (availH > 0 && H * s > availH) s = Math.min(s, availH / H);
      if (s > 1.4) s = 1.4;
      if (s <= 0) s = 0.5;
    } else {
      s = avail / W;
      if (s > 1.04) s = 1.04;
      if (s < 0.8) s = 0.8;
    }
    scale = s;
    world.style.transform = 'scale(' + s + ')';
    world.style.transformOrigin = '0 0';
    out.style.width = Math.round(W * s) + 'px';
    out.style.height = Math.round(H * s) + 'px';
    /* 스테이지를 부모 컨테이너 정중앙에 놓습니다(좌우 대칭) */
    var sideGap = Math.max(0, Math.round((avail - W * s) / 2));
    out.style.marginLeft = sideGap + 'px';
    out.style.marginRight = sideGap + 'px';
    wrap.style.height = Math.round(H * s) + 'px';
    canvas.width = Math.round(W * s * dpr);
    canvas.height = Math.round(H * s * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
  }

  /* ============================================================
     10. 부트
     ============================================================ */
  setMrows();
  snapshotPC();
  applyMode();
  buildLogs();
  buildPanels();
  buildAppendix();
  statHtml();
  window.addEventListener('resize', function () {
    /* 회전·창 크기 변경으로 화면 비율이 달라지면 모바일 캔버스 폭도 다시 정합니다 */
    if (MODE === 'm') {
      var wResize = pickMobileWidth();
      if (Math.abs(wResize - MW) > 4) { applyMode(); return; }
    }
    fit();
  });

  try { document.title = 'jev-topic-router · ' + (DATA.date || ''); } catch (e) {}
  var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (REDUCE) {
    /* 움직임을 줄이는 설정이면 마지막 상태를 정적으로 보여 줍니다. */
    T.playing = false;
    document.getElementById('playBtn').textContent = '▶';
    T.t = S4 + 0.8;
    tickTimeline();
    for (var tw = 0; tw < tweens.length; tw++) {
      var w0 = tweens[tw];
      w0.el.textContent = fmtNum(w0.to, w0.dec) + w0.suffix;
    }
    tweens.length = 0;
  } else {
    T.t = 0.001;
  }
  requestAnimationFrame(loop);

  /* 디버그용 (검증 스크립트에서 사용) */
  window.__JEV = {
    nodes: nodes, edges: edges, byId: byId, T: T, fit: fit,
    dims: function () {
      return { W: W, H: H, MODE: MODE, BUS: { x: BUS.x, top: BUS.top, w: BUS.w, h: BUS.h } };
    },
    setMode: setMode, switchMode: switchMode,
    layoutMobile: layoutMobile, restorePC: restorePC, snapshotPC: snapshotPC
  };
})();
</script>
</body>
